name: ci

# Gates ordinary work. release.yml only runs on a version tag, so without this
# nothing validates a normal push and a broken main would surface at release time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Format gate
        run: dotnet format MacAccents.csproj --verify-no-changes

      - name: Build
        run: dotnet build MacAccents.csproj -c Release -warnaserror
